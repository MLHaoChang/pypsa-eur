[pytest]
# Scoped pytest config for the pypsa-gui BACKEND only. Run with:
#   cd pypsa-gui/backend && <pixi-python> -m pytest
# or: <pixi-python> -m pytest pypsa-gui/backend/tests
#
# `python_files = test_*.py` means the legacy standalone `qa_*.py` scripts in
# tests/ are NEVER collected/imported by pytest (they're hand-rolled PASS/FAIL
# drivers, not pytest functions). The repo's top-level `pytest test` task is
# unaffected — this config only applies under this rootdir.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
markers =
    auth_smoke: Fast auth/tenancy integration smoke tests (login, org ACL, locks, legacy migrate)
