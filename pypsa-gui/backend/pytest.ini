[pytest]
# Scoped pytest config for the pypsa-gui BACKEND only. Run with:
#   cd pypsa-gui/backend && <pixi-python> -m pytest
# or: <pixi-python> -m pytest pypsa-gui/backend/tests
#
# `python_files = test_*.py` means the legacy standalone `qa_*.py` scripts in
# tests/ are NEVER collected/imported by pytest (they're hand-rolled PASS/FAIL
# drivers, not pytest functions). The repo's top-level `pytest test` task is
# unaffected — this config only applies under this rootdir.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
# A test still running after 60 s dumps every thread's stack to stderr (it does
# not fail the test), so a hang on a shared lock names its holder in the CI log.
# The ~50 legitimately slow tests dump once each, which is noise, not failure.
faulthandler_timeout = 60
markers =
    auth_smoke: Fast auth/tenancy integration smoke tests (login, org ACL, locks, legacy migrate)
    slow: Long-running validation (benchmark gates, high-draw MC) — excluded from quick loops via -m 'not slow'
    live_solve: Integration tests that invoke the real LP solver
