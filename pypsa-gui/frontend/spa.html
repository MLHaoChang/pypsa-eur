<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="theme-color" content="#151112" />
    <title>PyPSA Studio</title>
    <!-- Identity palette, shared with the static sign-in page. -->
    <link rel="stylesheet" href="/brand.css" />
    <style>
      /* Paint the themed surface before the bundle's CSS arrives, so the
         handoff from the sign-in page never flashes white. */
      html { background: #ffffff; color-scheme: light; }
      html[data-theme="dark"] { background: #151112; color-scheme: dark; }
    </style>
    <script>
      // Mirror uiStore's opening theme onto <html> before first paint:
      // the stored explicit choice, else the OS preference, else light
      // (THEME-LIGHT-1). Kept in sync with storedTheme() in
      // src/store/uiStore.ts by uiStore.theme.test.ts; both migrations are
      // idempotent, so whichever runs first wins.
      ;(function pypsaBootTheme() {
        var theme = 'light'
        try {
          if (localStorage.getItem('network-diagram:theme-schema') !== '2') {
            localStorage.removeItem('network-diagram:theme')
            localStorage.setItem('network-diagram:theme-schema', '2')
          }
          var stored = localStorage.getItem('network-diagram:theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (err) {
          /* storage blocked: fall back to light */
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script>
      window.__PYPSA_AUTH_BOOT__ = (async function pypsaAuthBoot() {
        try {
          var healthRes = await fetch('/api/health', { credentials: 'include' })
          if (!healthRes.ok) return 'health-failed'
          var health = await healthRes.json()
          if (!health.auth_enabled) return 'single-user'
          var meRes = await fetch('/api/auth/me', { credentials: 'include' })
          if (meRes.status === 401 || meRes.status === 403) {
            location.replace('/?needLogin=' + Date.now())
            return 'redirect-login'
          }
        } catch (err) {
          return 'boot-error'
        }
        return 'ok'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
