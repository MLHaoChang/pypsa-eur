# Local Postgres + Mailpit for multi-user auth development.
# Usage (from pypsa-gui/):
#   docker compose -f docker-compose.auth.yml up -d
# Mailpit UI: http://localhost:8025
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pypsa_gui
      POSTGRES_USER: pypsa
      POSTGRES_PASSWORD: pypsa
    ports:
      - "5432:5432"
    volumes:
      - pypsa-gui-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pypsa-gui-postgres:
