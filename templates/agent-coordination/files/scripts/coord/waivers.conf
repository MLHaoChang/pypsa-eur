# Overlap waivers: the one list premerge.sh, frontier.py and brief.py read.
# One `name=extended-regex` per line (POSIX ERE that is also a Python regex);
# `#` lines and blank lines are ignored; an empty value matches nothing.
#
# docs_only_re: overlap in these paths is harmless when the merge is clean.
#   premerge.sh waives it; frontier/brief print it as `soft`.
# inventory_overlap_re: a code file whose overlap is also soft (premerge decides it on
#   the trial merge); empty here. catalogue_re is project-specific; add it if needed.
docs_only_re=^({{RELEASE_NOTES_DIR}}/.*|docs/.*\.md|(.*/)?(CONTEXT|GLOSSARY)\.md|GLOSSARY-MAP\.md)$
inventory_overlap_re=
