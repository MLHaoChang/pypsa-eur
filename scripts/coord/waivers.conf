# Overlap waivers: the one list premerge.sh, frontier.py and brief.py read.
# One `name=extended-regex` per line (POSIX ERE that is also a Python regex);
# `#` lines and blank lines are ignored; an empty value matches nothing.
#
# docs_only_re: overlap in these paths is harmless when the merge is clean.
#   premerge.sh waives it; frontier/brief print it as `soft`.
# catalogue_re: a PR touching these must also pass the assistant inventory check.
# inventory_overlap_re: overlap only in this file does not block when the trial
#   merge is clean and the semantic tests and the inventory check pass; frontier
#   and brief print it as `soft`.
docs_only_re=^(docs/superpowers/OPEN-ITEMS\.md|docs/superpowers/plans/.*|doc/release-notes\.d/.*|doc/release_notes\.md|(.*/)?(CONTEXT|GLOSSARY)\.md|GLOSSARY-MAP\.md|pypsa-gui/backend/harness/README\.md)$
catalogue_re=(^|/)harness/catalogue
inventory_overlap_re=^pypsa-gui/backend/harness/catalogue\.py$
