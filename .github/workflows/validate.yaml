name: Validator Bot

on:
  pull_request:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-validation:
    name: Run validation
    # TWO conditions, and the second is this fork's.
    #
    # The first is upstream's: skip PRs opened from a fork of this repository,
    # because they cannot be trusted with the secrets below.
    #
    # The second exists because `runs-on: self-hosted` needs a self-hosted
    # runner registered against THIS repository, and there is not one. Without
    # it the job does not fail — it sits `queued` forever, on every pull
    # request, so no PR here has ever shown a complete check set. It has never
    # blocked a merge (it is not a required check), which is exactly why it
    # went unexamined for so long: a permanently yellow check is easy to learn
    # to ignore, and then a genuinely stuck check looks normal too.
    #
    # A repository VARIABLE rather than a hardcoded repo name: registering a
    # runner later is then a settings change, not a code change, and this file
    # does not have to name somebody else's repository to describe its own
    # capability. Set `PYPSA_VALIDATOR_SELF_HOSTED` to `true` under
    # Settings -> Secrets and variables -> Actions -> Variables once a runner
    # exists, and this job starts running again with no diff.
    #
    # `create-report` below needs this job, and a skipped dependency skips its
    # dependents, so both disappear from the check set together.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && vars.PYPSA_VALIDATOR_SELF_HOSTED == 'true'
    runs-on: self-hosted
    outputs:
      validation_failed: ${{ steps.check_validation.outputs.failed }}
    steps:
    - uses: lkstrp/pypsa-validator@v0.2.5
      id: validation
      continue-on-error: true
      with:
        step: run-self-hosted-validation
        env_file: envs/environment.yaml
        snakemake_config: config/test/config.validator.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check validation status
      id: check_validation
      run: |
        if [[ "${{ steps.validation.outcome }}" == "failure" ]]; then
          echo "failed=true" >> $GITHUB_OUTPUT
        else
          echo "failed=false" >> $GITHUB_OUTPUT
        fi

  create-report:
    name: Create report
    needs: run-validation
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.run-validation.outputs.validation_failed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: lkstrp/pypsa-validator@v0.2.5
      with:
        step: create-comment
        snakemake_config: config/test/config.validator.yaml
        # The path starting from prefix in config
        # For plot results/<prefix>/<scenario>/<plot_name>.png pass
        # <scenario>/<plot_name>.png
        plots: >
          "
          graphs/energy.pdf
          graphs/costs.pdf
          graphs/balances-energy.pdf
          graphs/balances-urban_central_heat.pdf
          graphs/balances-urban_decentral_heat.pdf
          graphs/balances-rural_heat.pdf
          "
        validator_key: ${{ secrets.VALIDATOR_KEY }}
