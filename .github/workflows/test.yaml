name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
  - cron: "0 5 * * 1-6"
  - cron: "0 5 * * 0"
  workflow_dispatch:

# Cancel any in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run unit tests
      run: |
        pixi run unit-tests

  gridspine-tests:
    name: Gridspine
    runs-on: ubuntu-latest
    # The suite solves real MILPs in its fixtures (~6-11 min observed); the cap
    # is there so a solve that stops converging fails loudly instead of holding
    # a runner for the six-hour default.
    timeout-minutes: 45

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          src:
            - 'gridspine/**'
            - 'tests/gridspine/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'

    - name: Skip - no gridspine changes
      if: steps.filter.outputs.src != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      run: echo "Skipping gridspine tests because no gridspine source changes detected"

    - name: Setup Pixi
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    # `gridspine-tests` sits in the root `[tasks]` table, so it resolves to the
    # `default` environment -- deliberately, since `gridspine/` is engine-caged
    # against exactly the packages `default` carries. Two skips are expected and
    # documented (no `from_psse` in pandapower 3.1.2; the PowerFactory fixture
    # awaits a manual export), so a green run here is 247 passed, 2 skipped.
    - name: Run gridspine tests
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        pixi run gridspine-tests

  # The pypsa-gui BACKEND suite. `unit-tests` above runs `pytest test`, which is
  # the upstream PyPSA-Eur `test/` directory, and `integration-tests` below is
  # filtered to `scripts/`, `rules/`, `data/`, `Snakefile` and `config/` — so
  # until this job existed, the ~2,600 tests guarding the primary product had no
  # CI at all and `pixi run gui-tests` was only ever run by hand.
  #
  # `pixi run gui-tests` resolves to the `test` environment because the task
  # lives in `[feature.test.tasks]` — see the comment on it in pixi.toml. That
  # environment is the one carrying pywebview, without which the two
  # desktop-download tests SKIP and a green suite means nothing.
  #
  # Four jobs, because one serial run of the ~14,000 tests took ~2 h:
  #   gui-backend-changes  the paths filter, once; the others read its output
  #   gui-backend-tests    the pytest suite, split by file into 4 shards
  #                        (`--num-shards`/`--shard-id`, tests/_shard.py)
  #   gui-backend-qa       the pilot evaluation gate and the qa_*.py drivers,
  #                        once, beside the shards
  #   gui-backend          "GUI backend", the check branch protection and the
  #                        sessions look for: green only if every job above is,
  #                        and green on its own when no backend file changed
  gui-backend-changes:
    name: GUI backend changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          gui:
            - 'pypsa-gui/backend/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'

  gui-backend-tests:
    name: GUI backend shard ${{ matrix.shard }}/4
    needs: gui-backend-changes
    if: needs.gui-backend-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1-based here for the job name; pytest's --shard-id is 0-based.
        shard: [1, 2, 3, 4]

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    # The full output goes to a log file and the artifact below, so a failure
    # can be read whole instead of from under the job log's tail.
    - name: Run backend tests
      run: |
        set -o pipefail
        mkdir -p pypsa-gui/backend/test-results
        pixi run gui-tests \
          --num-shards=4 --shard-id=$(( ${{ matrix.shard }} - 1 )) \
          --junitxml=test-results/junit.xml --durations=30 \
          2>&1 | tee pypsa-gui/backend/test-results/pytest.log

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-backend-shard-${{ matrix.shard }}-of-4
        path: pypsa-gui/backend/test-results/
        if-no-files-found: warn

  # Once, not per shard. In parallel with the shards rather than after them:
  # the qa_*.py drivers are excluded from pytest collection by pytest.ini and
  # so are invisible to the shards, and a broken suite still shows up as its
  # own red shard. ~2 min.
  gui-backend-qa:
    name: GUI backend pilot gate and QA drivers
    needs: gui-backend-changes
    if: needs.gui-backend-changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run checked pilot evaluation gate
      run: pixi run gui-pilot-evaluation

    - name: Upload checked pilot evaluation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checked-pilot-evaluation
        path: |
          pypsa-gui/backend/pilot-evaluation.json
          pypsa-gui/backend/pilot-evaluation.json.log
        if-no-files-found: error

    # Runs even when the gate fails, so one push reports both.
    - name: Run backend QA drivers
      if: success() || failure()
      run: |
        pixi run gui-qa-drivers

  gui-backend:
    name: GUI backend
    needs: [gui-backend-changes, gui-backend-tests, gui-backend-qa]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Skip - no backend changes
      if: needs.gui-backend-changes.result == 'success' && needs.gui-backend-changes.outputs.run != 'true'
      run: echo "Skipping tests because no pypsa-gui/backend changes detected"

    - name: Require every shard and the QA job
      if: needs.gui-backend-changes.result != 'success' || needs.gui-backend-changes.outputs.run == 'true'
      env:
        CHANGES: ${{ needs.gui-backend-changes.result }}
        TESTS: ${{ needs.gui-backend-tests.result }}
        QA: ${{ needs.gui-backend-qa.result }}
      run: |
        echo "changes=$CHANGES shards=$TESTS qa=$QA"
        [ "$CHANGES" = success ] && [ "$TESTS" = success ] && [ "$QA" = success ]

  # The pypsa-gui FRONTEND suite (vitest) and type-check. Until this job
  # existed no workflow ran `npm`/`vitest` at all, so the ~1,900 frontend tests
  # were only ever run by hand — the same gap `gui-backend-tests` closed for
  # the backend.
  gui-frontend-tests:
    name: GUI frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}
        working-directory: pypsa-gui/frontend

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          gui:
            - 'pypsa-gui/frontend/**'
            - '.github/workflows/test.yaml'

    - name: Skip - no frontend changes
      if: steps.filter.outputs.gui != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      run: echo "Skipping tests because no pypsa-gui/frontend changes detected"

    - name: Setup Node
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Install
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: npm ci --no-audit --no-fund

    - name: Type-check
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: npx tsc --noEmit -p .

    - name: Run frontend tests
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: npx vitest --run

  # Tier A owner journeys in a real browser (LC-13): the built app against the
  # authenticated native backend, with the scripted loopback wire for the model.
  # No network call to any paid model. Not part of "GUI backend": a browser
  # flake must not hold the backend gate, and it has its own paths filter.
  gui-owner-journeys:
    name: GUI owner journeys (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash -l {0}

    env:
      # Pinned: the browser build follows this version.
      PLAYWRIGHT_VERSION: "1.63.0"
      OJ01_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj01
      OJ05_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj05
      OJ21_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj21

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          gui:
            - 'pypsa-gui/backend/**'
            - 'pypsa-gui/frontend/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'

    - name: Skip - no GUI changes
      if: steps.filter.outputs.gui != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      run: echo "Skipping owner journeys because no GUI changes detected"

    - name: Setup Pixi
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        environments: test
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Setup Node
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Build the frontend
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      working-directory: pypsa-gui/frontend
      run: |
        npm ci --no-audit --no-fund
        npm run build

    - name: Install Playwright and its Chromium
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
        "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

    - name: Run the owner journeys (OJ-01, OJ-05, OJ-21)
      if: steps.filter.outputs.gui == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      working-directory: pypsa-gui/frontend
      env:
        PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/pw/node_modules/playwright/package.json
        PYPSA_COMPOSER_PYTHON: ${{ github.workspace }}/.pixi/envs/test/bin/python
      run: |
        mkdir -p "$OJ01_ARTIFACTS" "$OJ05_ARTIFACTS" "$OJ21_ARTIFACTS"
        status=0
        node scripts/smoke-copilot-oj01.mjs || status=1
        node scripts/smoke-copilot-oj05.mjs || status=1
        node scripts/smoke-copilot-oj21.mjs || status=1
        exit $status

    - name: Upload journey screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-owner-journeys
        path: oj-artifacts/
        if-no-files-found: ignore

  integration-tests:
    name: Integration
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # Run windows only on scheduled runs on Sundays, otherwise ignore
        os: ${{ github.event.schedule == '0 5 * * 0' && fromJson('["ubuntu", "macos", "windows"]') || fromJson('["ubuntu", "macos"]') }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          src:
            - 'scripts/**'
            - 'rules/**'
            - 'data/**'
            - 'Snakefile'
            - 'config/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'

    - name: Free up disk space
      run: |
        echo "Initial disk space"
        df -h
        echo "Free up disk space"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a --force
        echo "Final disk space"
        df -h

    - name: Skip - no source changes
      if: steps.filter.outputs.src != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      run: echo "Skipping tests because no source code changes detected"

    - name: Setup Pixi
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Setup cache keys
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        echo "WEEK=$(date +'%Y%U')" >> $GITHUB_ENV # data
        echo "MONTH=$(date +'%Y%m')" >> $GITHUB_ENV # cutouts
        echo "VERSIONS_HASH=${{ hashFiles('data/versions.csv') }}" >> $GITHUB_ENV

    - uses: actions/cache@v6
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      with:
        path: data
        key: data-${{ env.WEEK }}-${{ env.VERSIONS_HASH }}

    - uses: actions/cache@v6
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      with:
        path: cutouts
        key: cutouts-${{ env.MONTH }}

    - name: Restore git-tracked files in data/
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: git checkout HEAD -- data/

    - name: Run pylint check on scripts
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      # check for undefined variables to reuse functions across scripts
      run: |
        pixi run -e dev pylint --disable=all --enable=E0601,E0606 --output-format=parseable scripts/add_* scripts/prepare_* scripts/solve_*

    - name: Run snakemake test workflows
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      env:
        SNAKEMAKE_STORAGE_CACHED_HTTP_CACHE: ""
        SNAKEMAKE_STORAGE_CACHED_HTTP_SKIP_REMOTE_CHECKS: "1"
      run: |
        pixi run integration-tests

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ matrix.os }}
        path: |
          logs
          .snakemake/log
          results
        retention-days: 3

    - name: Show remaining disk space
      if: always()
      run: df -h
