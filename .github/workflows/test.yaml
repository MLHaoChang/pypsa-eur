name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
  - cron: "0 5 * * 1-6"
  - cron: "0 5 * * 0"
  workflow_dispatch:

# Cancel any in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every paths filter runs once, here (RETRO-CI-1). A job with nothing to test
  # is skipped by its job-level `if:` on one of these outputs, so it never takes
  # a runner slot: the bottleneck is concurrent job slots, not runner-minutes.
  # Scheduled and manual runs always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit_inputs == 'true' || steps.not_docs.outputs.unit == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      gridspine: ${{ steps.filter.outputs.gridspine == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      gui_backend: ${{ steps.filter.outputs.gui_backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      gui_frontend: ${{ steps.filter.outputs.gui_frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      gui_journeys: ${{ steps.filter.outputs.gui_journeys == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      integration: ${{ steps.filter.outputs.integration == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          gridspine:
            - 'gridspine/**'
            - 'tests/gridspine/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'
          gui_backend:
            - 'pypsa-gui/backend/**'
            - 'pypsa-gui/tool-error-kinds.json'
            - 'pypsa-gui/tool-error-kinds.d/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'
          gui_frontend:
            - 'pypsa-gui/frontend/**'
            - 'pypsa-gui/tool-error-kinds.json'
            - 'pypsa-gui/tool-error-kinds.d/**'
            - '.github/workflows/test.yaml'
          gui_journeys:
            - 'pypsa-gui/backend/**'
            - 'pypsa-gui/frontend/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'
          integration:
            - 'scripts/**'
            - 'rules/**'
            - 'data/**'
            - 'Snakefile'
            - 'config/**'
            - 'pixi.toml'
            - 'pixi.lock'
            - '.github/workflows/test.yaml'
          # The docs files that `pytest test` reads (OPEN-ITEMS numbering, the
          # coordination scripts' docs/agents files, the release-notes hook).
          unit_inputs:
            - 'docs/agents/**'
            - 'docs/superpowers/OPEN-ITEMS.md'
            - 'doc/hooks.py'
            - 'doc/release_notes.md'

    # Unit ran on every pull request before. It still does, except for a change
    # that only touches docs, release-note fragments or scratch notes: the
    # `every` quantifier makes a file count only if it is outside all of these.
    - uses: dorny/paths-filter@v4
      id: not_docs
      with:
        predicate-quantifier: every
        filters: |
          unit:
            - '**'
            - '!doc/**'
            - '!docs/**'
            - '!.scratch/**'

  unit-tests:
    name: Unit
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run unit tests
      run: |
        pixi run unit-tests

  gridspine-tests:
    name: Gridspine
    needs: changes
    if: needs.changes.outputs.gridspine == 'true'
    runs-on: ubuntu-latest
    # The suite solves real MILPs in its fixtures (~6-11 min observed); the cap
    # is there so a solve that stops converging fails loudly instead of holding
    # a runner for the six-hour default.
    timeout-minutes: 45

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    # `gridspine-tests` sits in the root `[tasks]` table, so it resolves to the
    # `default` environment -- deliberately, since `gridspine/` is engine-caged
    # against exactly the packages `default` carries. Two skips are expected and
    # documented (no `from_psse` in pandapower 3.1.2; the PowerFactory fixture
    # awaits a manual export), so a green run here is 247 passed, 2 skipped.
    - name: Run gridspine tests
      run: |
        pixi run gridspine-tests

  # The pypsa-gui BACKEND suite. `unit-tests` above runs `pytest test`, which is
  # the upstream PyPSA-Eur `test/` directory, and `integration-tests` below is
  # filtered to `scripts/`, `rules/`, `data/`, `Snakefile` and `config/` — so
  # until this job existed, the ~2,600 tests guarding the primary product had no
  # CI at all and `pixi run gui-tests` was only ever run by hand.
  #
  # `pixi run gui-tests` resolves to the `test` environment because the task
  # lives in `[feature.test.tasks]` — see the comment on it in pixi.toml. That
  # environment is the one carrying pywebview, without which the two
  # desktop-download tests SKIP and a green suite means nothing.
  #
  # Four jobs, because one serial run of the ~14,000 tests took ~2 h:
  #   changes              the paths filters, once (the job at the top)
  #   gui-backend-tests    the pytest suite, split by file into 8 shards, each run with
  #                        pytest-xdist across the runner's cores (`-n auto --dist
  #                        loadfile`: a file stays in one worker process)
  #                        (`--num-shards`/`--shard-id`, tests/_shard.py)
  #   gui-backend-qa       the pilot evaluation gate and the qa_*.py drivers,
  #                        once, beside the shards
  #   gui-backend          "GUI backend", the check branch protection and the
  #                        sessions look for: green only if every job above is,
  #                        and green on its own when no backend file changed
  gui-backend-tests:
    name: GUI backend shard ${{ matrix.shard }}/8
    needs: changes
    if: needs.changes.outputs.gui_backend == 'true'
    runs-on: ubuntu-latest
    # A healthy shard on the 4-shard layout takes up to ~150 min. Without a cap
    # a hung shard held its runner for GitHub's 6 h limit. Once the shards run
    # under xdist (~25 min each) this can drop to ~60.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # 1-based here for the job name; pytest's --shard-id is 0-based.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    # Route-parity tests build the parity in memory (RETRO-COST-1), and its GUI
    # scanner, scripts/api-bindings.mjs, needs the frontend's TypeScript.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Install the frontend (the parity scanner uses its TypeScript)
      working-directory: pypsa-gui/frontend
      run: npm ci --no-audit --no-fund

    # The full output goes to a log file and the artifact below, so a failure
    # can be read whole instead of from under the job log's tail. `-vv` (on top
    # of pytest.ini's -q) prints every test's name, so a shard that stalls
    # shows which test it stalled on.
    - name: Run backend tests
      run: |
        set -o pipefail
        mkdir -p pypsa-gui/backend/test-results
        pixi run gui-tests \
          --num-shards=8 --shard-id=$(( ${{ matrix.shard }} - 1 )) \
          -n auto --dist loadfile \
          --junitxml=test-results/junit.xml --durations=30 -vv \
          2>&1 | tee pypsa-gui/backend/test-results/pytest.log

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-backend-shard-${{ matrix.shard }}-of-8
        path: pypsa-gui/backend/test-results/
        if-no-files-found: warn

  # Once, not per shard. In parallel with the shards rather than after them:
  # the qa_*.py drivers are excluded from pytest collection by pytest.ini and
  # so are invisible to the shards, and a broken suite still shows up as its
  # own red shard. ~2 min.
  gui-backend-qa:
    name: GUI backend pilot gate and QA drivers
    needs: changes
    if: needs.changes.outputs.gui_backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run checked pilot evaluation gate
      run: pixi run gui-pilot-evaluation

    - name: Upload checked pilot evaluation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checked-pilot-evaluation
        path: |
          pypsa-gui/backend/pilot-evaluation.json
          pypsa-gui/backend/pilot-evaluation.json.log
        if-no-files-found: error

    # Runs even when the gate fails, so one push reports both.
    - name: Run backend QA drivers
      if: success() || failure()
      run: |
        pixi run gui-qa-drivers

  gui-backend:
    name: GUI backend
    needs: [changes, gui-backend-tests, gui-backend-qa]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Skip - no backend changes
      if: needs.changes.result == 'success' && needs.changes.outputs.gui_backend != 'true'
      run: echo "Skipping tests because no pypsa-gui/backend changes detected"

    - name: Require every shard and the QA job
      if: needs.changes.result != 'success' || needs.changes.outputs.gui_backend == 'true'
      env:
        CHANGES: ${{ needs.changes.result }}
        TESTS: ${{ needs.gui-backend-tests.result }}
        QA: ${{ needs.gui-backend-qa.result }}
      run: |
        echo "changes=$CHANGES shards=$TESTS qa=$QA"
        [ "$CHANGES" = success ] && [ "$TESTS" = success ] && [ "$QA" = success ]

  # The pypsa-gui FRONTEND suite (vitest) and type-check. Until this job
  # existed no workflow ran `npm`/`vitest` at all, so the ~1,900 frontend tests
  # were only ever run by hand — the same gap `gui-backend-tests` closed for
  # the backend.
  gui-frontend-tests:
    name: GUI frontend
    needs: changes
    if: needs.changes.outputs.gui_frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}
        working-directory: pypsa-gui/frontend

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Install
      run: npm ci --no-audit --no-fund

    - name: Type-check
      run: npx tsc --noEmit -p .

    - name: Run frontend tests
      run: npx vitest --run

  # Tier A owner journeys in a real browser (LC-13): the built app against the
  # authenticated native backend, with the scripted loopback wire for the model.
  # No network call to any paid model. Not part of "GUI backend": a browser
  # flake must not hold the backend gate, and it has its own paths filter.
  gui-owner-journeys:
    name: GUI owner journeys (browser)
    needs: changes
    if: needs.changes.outputs.gui_journeys == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -l {0}

    env:
      # Pinned: the browser build follows this version.
      PLAYWRIGHT_VERSION: "1.63.0"
      OJ01_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj01
      OJ05_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj05
      OJ21_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/oj21
      LC03H_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/lc03h
      TJ_ARTIFACTS: ${{ github.workspace }}/oj-artifacts/template-journey

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        environments: test
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Build the frontend
      working-directory: pypsa-gui/frontend
      run: |
        npm ci --no-audit --no-fund
        npm run build

    - name: Install Playwright and its Chromium
      run: |
        npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
        "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

    - name: Run the owner journeys (OJ-01, OJ-05, OJ-21, LC-03 past runs)
      working-directory: pypsa-gui/frontend
      env:
        PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/pw/node_modules/playwright/package.json
        PYPSA_COMPOSER_PYTHON: ${{ github.workspace }}/.pixi/envs/test/bin/python
      run: |
        mkdir -p "$OJ01_ARTIFACTS" "$OJ05_ARTIFACTS" "$OJ21_ARTIFACTS" "$LC03H_ARTIFACTS" "$TJ_ARTIFACTS"
        status=0
        node scripts/smoke-copilot-oj01.mjs || status=1
        node scripts/smoke-copilot-oj05.mjs || status=1
        node scripts/smoke-copilot-oj21.mjs || status=1
        node scripts/smoke-copilot-lc03-historical.mjs || status=1
        node scripts/smoke-copilot-lc06-d24.mjs || status=1
        # E2E-TEMPLATES-1: the template journey, section 3 (template-e2e 02).
        node scripts/smoke-template-journey-connection.mjs || status=1
        exit $status

    - name: Upload journey screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-owner-journeys
        path: oj-artifacts/
        if-no-files-found: ignore

  # Template end-to-end journeys (E2E-TEMPLATES-1): one browser journey per
  # workflow template through the built app, no model. Pull requests that touch
  # the GUI run the short journey (default study budget, a few minutes per
  # template); the scheduled run and a manual dispatch run the full journey.
  # Open gaps from .scratch/template-e2e are expected failures keyed to their
  # issue and flip green when fixed. Not part of "GUI backend", like the owner
  # journeys: a browser flake must not hold the backend gate.
  gui-template-journeys:
    name: GUI template journeys (browser)
    needs: changes
    if: needs.changes.outputs.gui_journeys == 'true'
    runs-on: ubuntu-latest
    # The full journey waits for the staged concentrator study (26,280 snapshots,
    # up to 30 steps), which took over 15 minutes locally.
    timeout-minutes: 150

    defaults:
      run:
        shell: bash -l {0}

    env:
      PLAYWRIGHT_VERSION: "1.63.0"
      TEMPLATE_JOURNEYS_ARTIFACTS: ${{ github.workspace }}/template-journeys-artifacts

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        environments: test
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pypsa-gui/frontend/package-lock.json

    - name: Build the frontend
      working-directory: pypsa-gui/frontend
      run: |
        npm ci --no-audit --no-fund
        npm run build

    - name: Install Playwright and its Chromium
      run: |
        npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
        "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

    - name: Run the template journeys (short on pull requests, full on schedule)
      working-directory: pypsa-gui/frontend
      env:
        PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/pw/node_modules/playwright/package.json
        PYPSA_COMPOSER_PYTHON: ${{ github.workspace }}/.pixi/envs/test/bin/python
        JOURNEY_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'short' }}
      run: node scripts/template-journeys.mjs --mode "$JOURNEY_MODE"

    - name: Upload journey screenshots and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-template-journeys
        path: template-journeys-artifacts/
        if-no-files-found: ignore

  integration-tests:
    name: Integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # Run windows only on scheduled runs on Sundays, otherwise ignore
        os: ${{ github.event.schedule == '0 5 * * 0' && fromJson('["ubuntu", "macos", "windows"]') || fromJson('["ubuntu", "macos"]') }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7

    - name: Free up disk space
      run: |
        echo "Initial disk space"
        df -h
        echo "Free up disk space"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a --force
        echo "Final disk space"
        df -h

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.68.1
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Setup cache keys
      run: |
        echo "WEEK=$(date +'%Y%U')" >> $GITHUB_ENV # data
        echo "MONTH=$(date +'%Y%m')" >> $GITHUB_ENV # cutouts
        echo "VERSIONS_HASH=${{ hashFiles('data/versions.csv') }}" >> $GITHUB_ENV

    - uses: actions/cache@v6
      with:
        path: data
        key: data-${{ env.WEEK }}-${{ env.VERSIONS_HASH }}

    - uses: actions/cache@v6
      with:
        path: cutouts
        key: cutouts-${{ env.MONTH }}

    - name: Restore git-tracked files in data/
      run: git checkout HEAD -- data/

    - name: Run pylint check on scripts
      # check for undefined variables to reuse functions across scripts
      run: |
        pixi run -e dev pylint --disable=all --enable=E0601,E0606 --output-format=parseable scripts/add_* scripts/prepare_* scripts/solve_*

    - name: Run snakemake test workflows
      env:
        SNAKEMAKE_STORAGE_CACHED_HTTP_CACHE: ""
        SNAKEMAKE_STORAGE_CACHED_HTTP_SKIP_REMOTE_CHECKS: "1"
      run: |
        pixi run integration-tests

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ matrix.os }}
        path: |
          logs
          .snakemake/log
          results
        retention-days: 3

    - name: Show remaining disk space
      if: always()
      run: df -h
