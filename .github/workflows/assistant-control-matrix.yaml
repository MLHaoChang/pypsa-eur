name: Assistant control matrix

on:
  pull_request:
    branches: [master]
    paths:
      - '.scratch/live-voice/capability-matrix.json'
      - '.scratch/live-voice/capability-inventory.json'
      - '.scratch/live-voice/route-parity.json'
      - 'pypsa-gui/backend/smoke/assistant_control_matrix.py'
      - 'pypsa-gui/backend/tests/test_assistant_control_matrix.py'
      - 'pypsa-gui/frontend/src/layout/CreationForm.tsx'
      - 'pypsa-gui/frontend/src/utils/attributeCatalog.ts'
      - '.github/workflows/assistant-control-matrix.yaml'
  push:
    branches: [master]
    paths:
      - '.scratch/live-voice/capability-matrix.json'
      - '.scratch/live-voice/capability-inventory.json'
      - '.scratch/live-voice/route-parity.json'
      - 'pypsa-gui/backend/smoke/assistant_control_matrix.py'
      - 'pypsa-gui/backend/tests/test_assistant_control_matrix.py'
      - 'pypsa-gui/frontend/src/layout/CreationForm.tsx'
      - 'pypsa-gui/frontend/src/utils/attributeCatalog.ts'
      - '.github/workflows/assistant-control-matrix.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check editable-control matrix against CreationForm and catalog
        run: python pypsa-gui/backend/smoke/assistant_control_matrix.py --check
