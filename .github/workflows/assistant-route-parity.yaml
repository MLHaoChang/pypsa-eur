name: Assistant route parity

on:
  pull_request:
    branches: [master]
    paths:
      # Everything the in-memory builds read (nothing generated is committed).
      - 'pypsa-gui/frontend/src/**'
      - 'pypsa-gui/frontend/scripts/api-bindings.mjs'
      # The builds `import main`, so any backend module can change the routes.
      - 'pypsa-gui/backend/**'
      - '!pypsa-gui/backend/tests/**'
      - 'pypsa-gui/backend/tests/test_assistant_route_parity.py'
      - 'pypsa-gui/backend/tests/test_assistant_control_matrix.py'
      - '.scratch/live-voice/application-coverage.md'
      - '.github/workflows/assistant-route-parity.yaml'
  push:
    branches: [master]
    paths:
      # Everything the in-memory builds read (nothing generated is committed).
      - 'pypsa-gui/frontend/src/**'
      - 'pypsa-gui/frontend/scripts/api-bindings.mjs'
      # The builds `import main`, so any backend module can change the routes.
      - 'pypsa-gui/backend/**'
      - '!pypsa-gui/backend/tests/**'
      - 'pypsa-gui/backend/tests/test_assistant_route_parity.py'
      - 'pypsa-gui/backend/tests/test_assistant_control_matrix.py'
      - '.scratch/live-voice/application-coverage.md'
      - '.github/workflows/assistant-route-parity.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.68.1
          environments: test
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pypsa-gui/frontend/package-lock.json

      - name: Install the frontend (the scanner uses its TypeScript)
        working-directory: pypsa-gui/frontend
        run: npm ci --no-audit --no-fund

      - name: Check every GUI route maps to a tool or a declared gap
        run: pixi run -e test python pypsa-gui/backend/smoke/assistant_route_parity.py --check

      - name: Check the editable-control matrix (it summarises route parity, so it runs here)
        run: pixi run -e test python pypsa-gui/backend/smoke/assistant_control_matrix.py --check

      - name: Route-parity and control-matrix contract tests
        env:
          REQUIRE_TS_SCANNER: '1'
        working-directory: pypsa-gui/backend
        run: pixi run -e test python -m pytest -q tests/test_assistant_route_parity.py tests/test_assistant_control_matrix.py
