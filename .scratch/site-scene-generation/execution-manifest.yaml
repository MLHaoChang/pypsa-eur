case_status_default: planned
case_ownership_rule: Exactly one primary owner per V row. Additional cases require applicable assertions in that
  unit. Primary ownership is bookkeeping, not sole coverage; mixed-engine rows remain partial until every claimed
  assertion has evidence. Prototype probes never mark downstream cases passed.
case_evidence_required_fields: [case_id, assertion, unit_id, test_node, fixture_hash, source_sha, command, exit_status,
  evidence_url, status, exclusions]
