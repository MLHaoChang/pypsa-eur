tenacity = "==9.1.2"
tsam = "==2.3.9"

[feature.test.tasks]

integration-tests = """
    snakemake -call solve_elec_networks --configfile config/test/config.electricity.yaml &&
    snakemake -call --configfile config/test/config.overnight.yaml &&
    snakemake -call --configfile config/test/config.myopic.yaml &&
    snakemake -call resources/test-elec-clusters/networks/base_s_adm.nc --configfile config/test/config.clusters.yaml &&
    snakemake -call --configfile config/test/config.scenarios.yaml -n &&
    snakemake -call plot_power_networks_clustered --configfile config/test/config.tyndp.yaml &&
    echo "All tests completed successfully."
"""
clean-tests = """
    snakemake -call solve_elec_networks --configfile config/test/config.electricity.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.overnight.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.myopic.yaml --delete-all-output ;
    snakemake -call resources/test-elec-clusters/networks/base_s_adm.nc --configfile config/test/config.clusters.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.scenarios.yaml -n --delete-all-output ;
    snakemake -call plot_power_networks_clustered --configfile config/test/config.tyndp.yaml --delete-all-output ;
	echo "All test outputs have been cleaned up."
"""
unit-tests = "pytest test"

all-tests = {depends-on = ["integration-tests", "clean-tests", "unit-tests"]}

generate-config = "pytest test/test_config_schema.py --fix"

# Workstream H: the pywebview desktop shell. Deliberately a FEATURE, not a
# default dependency — the default environment is what `snakemake -call` solves
# PyPSA-Eur with, and re-solving it to add a GUI toolkit is a risk with no
# upside. Run the shell with `pixi run -e desktop ...`.
#
# PyInstaller is NOT here. D14 builds the frozen app from a separate pip-wheel
# venv, because freezing the conda env produces a build that works on the
# developer's box and fails on a clean machine.
[feature.desktop.dependencies]
# Intentionally empty of version pins. `desktop` shares a SOLVE GROUP with
# `default` (see `[environments]`), so every package the two have in common is
# guaranteed identical by the solver rather than by an enumerated list here.
#
# Three earlier attempts are recorded in `tests/test_desktop_environment.py`
# so they are not retried: pinning `python` alone, pinning a curated "core"
# list, and pinning that list plus the backend's import closure. None
# converged — the last still left win-64 on NETLIB reference BLAS with no
# OpenBLAS, invisible because numpy and scipy were pinned identically.

[feature.desktop.pypi-dependencies]
pywebview = "*"

[feature.test.dependencies]
pytest = ">=8.4.2"

[environments]
doc = { features = ["doc"], no-default-feature = true }
# `desktop` is here for ONE package, `pywebview`, and it is not optional:
# without it `test_desktop_downloads.py` silently SKIPS the two tests that
# matter — the one pinning pywebview's dangerous default and the one that
# fails if `gui.py` stops enabling downloads. A skipped test reads as a green
# suite, which is how a hole this size stays open.
test = { features = ["test", "dev", "desktop"], solve-group = "gui" }
dev = { features = ["dev"], solve-group = "gui" }
# ONE solve group. `desktop` runs the pypsa-gui backend and the backend suite
# runs in `default`, so the two must resolve identically or the app that ships
# is not the app that was tested. Solved independently they did not, and three
# rounds of pinning package-by-package never converged: the last round still
# had `desktop` on NETLIB reference BLAS with no OpenBLAS at all on win-64,
# invisible because numpy and scipy were pinned identically.
#
# A solve group makes them agree by construction rather than by enumeration.
# The cost is that `default` is re-solved — which is why the optimisation
# packages are pinned above.
#
# `test` and `dev` are IN THE GROUP TOO, and leaving them out was a defect in
# the first attempt: `.github/workflows/test.yaml` runs both `unit-tests` and
# `integration-tests` through `[feature.test.tasks]`, i.e. in `test`. Grouping
# only `default` and `desktop` re-solved those two and left `test` behind, so
# the environment that ships had NO ci coverage and the environment CI gates on
# was 85-105 packages away from it. That is the same defect the group exists to
# remove, relocated.
#
# `doc` stays out: it is `no-default-feature = true` with its own pypsa 1.0.3,
# so it shares nothing and a group would only over-constrain it.
default = { solve-group = "gui" }
desktop = { features = ["desktop"], solve-group = "gui" }
