[workspace]
authors = ["Contributors to PyPSA-Eur"]
channels = ["conda-forge", "bioconda", "gurobi"]
name = "pypsa-eur"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "2025.07.0"
exclude-newer = "7d"

[exclude-newer]
linopy = "0d"
pypsa = "0d"
atlite = "0d"

[tasks]

gui-backend  = { cmd = "uvicorn main:app --reload --port 8000", cwd = "pypsa-gui/backend" }
gui-frontend = { cmd = "npm run dev", cwd = "pypsa-gui/frontend" }
gui          = { depends-on = ["gui-backend", "gui-frontend"] }
gui-tests    = { cmd = "python -m pytest", cwd = "pypsa-gui/backend" }
gui-db-up    = { cmd = "docker compose up -d", cwd = "pypsa-gui" }
gui-db-down  = { cmd = "docker compose down", cwd = "pypsa-gui" }
setup-ssl-bypass = "python scripts/install_ssl_bypass.py"

reset = """bash -c '
    read -p "Do you really wanna continue? This will remove all contents of \
logs, resources, benchmarks, results, and .snakemake directories except \
.gitkeep files (config/config.yaml will not be deleted) (y/n): " ans && \
    case $ans in \
        [Yy]*) \
            for dir in ./logs ./resources ./benchmarks ./results ./.snakemake; do \
                find "$dir" -mindepth 1 ! -name ".gitkeep" -delete 2>/dev/null || true; \
            done; \
            echo "Reset completed.";; \
        [Nn]*) \
            echo "Reset cancelled.";; \
        *) \
            echo "Please answer yes or no."; exit 1;; \
    esac'
"""

update-dags = """
	snakemake results/networks/base_s_128_elec_.nc -F --dag | sed -n "/digraph/,/}/p" | dot -Tsvg -o doc/img/intro-workflow.svg && \
	snakemake --rulegraph -F | sed -n "/digraph/,/}/p" | dot -Tsvg -o doc/img/workflow.svg && \
	snakemake --dag --configfile config/test/config.electricity.yaml | sed -n '/^digraph/,$ p' | dot -Tsvg -o doc/img/dag_electricity.svg && \
	snakemake --dag --configfile config/test/config.overnight.yaml | sed -n '/^digraph/,$ p' | dot -Tsvg -o doc/img/dag_overnight.svg && \
	snakemake --dag --configfile config/test/config.myopic.yaml | sed -n '/^digraph/,$ p' | dot -Tsvg -o doc/img/dag_myopic.svg
"""

sync-locks = """
    pixi install -e default && \
    pixi workspace export conda-explicit-spec -e default envs && \
    bash -c 'for f in envs/*_conda_spec*; do mv "$f" "${f/_conda_spec/.pin}"; done' && \
    pixi workspace export conda-environment -e default envs/environment.yaml -n pypsa-eur
"""

[dependencies]
nodejs = ">=22"
fastapi = ">=0.115"
# PINNED: `desktop/launcher.py`'s entire shutdown design is verified against
# uvicorn 0.51.0's internals — `Server.started`, the `if self.started` guard
# before `shutdown()`, and `timeout_graceful_shutdown` reaching
# `asyncio.wait_for`. None of those is public API. A minor bump can change them
# silently and the tests would still pass, because they assert the BEHAVIOUR
# this version happens to provide.
uvicorn = "==0.51.0"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
psycopg = ">=3.1"
pydantic-settings = ">=2.0"
httpx = ">=0.27"
python-multipart = ">=0.0.12"
sse-starlette = ">=2.1"
aiofiles = ">=24.0"
# Pinned: atlite builds renewable capacity factors, i.e. a direct optimisation
# INPUT, and it is on the `[exclude-newer] = "0d"` list above so every re-lock
# would otherwise take the newest release. Named as floating in this repo's own
# test docstring while two of the three names beside it had been pinned.
atlite = "==0.6.1"
bokeh = ">=3.8.0"
cartopy = ">=0.25.0"
copernicusmarine = ">=2.2.4"
country_converter = ">=1.3.2"
dask = ">=2025.10.0"
descartes = ">=1.1.0"
entsoe-py = ">=0.7.8"
fiona = ">=1.10.1"
folium = ">=0.20.0"
geojson = ">=3.2.0"
geopandas = ">=1"
geopy = ">=2.4.1"
glpk = ">=5.0"
graphviz = ">=12.2.1"
gurobi = ">=12.0.3"
# The LP solver. Pinned for the same reason as pypsa: a solver change moves
# optimisation results, and this workstream is about windows and shutdown.
highspy = "==1.14.0"
# The OTHER solver in the workspace. Missed on the first pass, which claimed
# "a solver change would be the risk and both are pinned" while scip had in
# fact moved 10.0.2 -> 10.0.3 on all four platforms. CLAUDE.md documents SCIP
# as one of the four supported solvers.
scip = "==10.0.2"
ipython = ">=9.7.0"
jpype1 = ">=1.6.0"
libgdal-netcdf = ">=3.10.3"
# The LP modelling layer between pypsa and the solver — pinned alongside them
# for the same reason, and it is also on the `exclude-newer = "0d"` list.
linopy = "==0.8.0"
lxml = ">=6.0.2"
matplotlib = ">=3.10.7"
memory_profiler = ">=0.61.0"
netcdf4 = ">=1.7.2,!=1.7.4"
networkx = ">=3.5"
numpy = ">=1.26.4"
openpyxl = ">=3.1.5"
pandas = ">=2.1"
plotly = ">=6.4.0"
powerplantmatching = ">=0.5.15"
pydantic = ">=2"
python-dotenv = ">=1.0"
proj = ">=9.6.2"
pydeck = ">0.6"  # pypsa fails to import with pydeck <0.6, lower bound was only added from pypsa 1.0.6
# PINNED, not a floor. `[exclude-newer] pypsa = "0d"` above deliberately lets
# pypsa float to the newest release, which is correct for a workspace that is
# re-locked often — and fatal the moment a second environment is solved
# independently, because that environment gets today's pypsa while `pixi.lock`
# still holds the one the tests were written against. CLAUDE.md documents
# multi-port Link vintage workarounds scoped to 1.1.2 that took five re-solves
# to converge on. Bump deliberately, with a full re-validation, not as a side
# effect of adding an environment.
pypsa = "==1.1.2"
pyscipopt = "==6.2.0"   # see the `scip` pin above
pytables = ">=3.10.2"
python = ">=3.10"
pytz = ">=2025.2"
pyxlsb = ">=1.0.10"
rasterio = ">=1.4.3"
rasterstats = ">=0.10.3"
rioxarray = ">=0.20.0"
"ruamel.yaml" = ">=0.18.0"
scipy = ">=1.16.3"
seaborn = ">=0.13.2"
shapely = ">=2.0"
snakemake-executor-plugin-cluster-generic = ">=1.0.9"
snakemake-minimal = ">=9"
snakemake-storage-plugin-http = ">=0.3"
tenacity = ">=9.1.2"
tqdm = ">=4.67.1"
# Temporal aggregation for `prepare_network` / `prepare_perfect_foresight`.
# Left unpinned it took a MAJOR jump, 2.3.9 -> 3.4.1, on win-64 only — the one
# platform nobody working on this can run.
tsam = "==2.3.9"
xarray = ">=2024.3.0,<2025.7.0"
xlrd = ">=2.0.2"
yaml = ">=0.2.5"
snakemake-storage-plugin-cached-http = ">=0.2.1"
pandera = ">=0.28.1"
natsort = ">=8.4.0"
snakemake-logger-plugin-pypsa = ">=0.1.0"
pydeflate = ">=2.3.4"
grpcio = "<1.78"
# Chatbot uploads (Phase A) — MIME sniff, .docx parsing, PDF page count.
python-magic = ">=0.4.27"
python-docx = ">=0.8.11"
pypdf = ">=4.0"
snakemake-logger-plugin-snkmt = "==0.1.6" # For better pypsa-app integration
streamlit = ">=1.36"
anthropic = ">=0.117.0"

[pypi-dependencies]
pwdlib = { version = ">=0.2", extras = ["argon2"] }
emails = ">=0.6"

[target.unix.dependencies]
snakemake-executor-plugin-slurm = ">=1.9.2"

[feature.dev.dependencies]
pre-commit = ">=4.3.0"
pylint = ">=4.0.2"
ruff = ">=0.14.3"
jupyter = ">=1.1.1"

[feature.doc.tasks.build-docs]
cmd = "mkdocs build -d {{ dir }}/html"
args = ["dir"]

[feature.doc.dependencies]
atlite = "==0.4.1"
cartopy = "==0.25.0"
dask = "==2025.11.0"
descartes = "==1.1.0"
fiona = "==1.10.1"
graphviz = "==13.1.2"
matplotlib = "==3.10.7"
memory_profiler = "==0.61.0"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = ">=0.29"
mkdocstrings-python = ">=1.16"
mkdocs-bibtex = ">=2.16"
pymdown-extensions = ">=10.0"
mkdocs-macros-plugin = ">=1.0"
mkdocs-table-reader-plugin = ">=3.1"
snakemake-minimal = ">=9"
powerplantmatching = "==0.7.1"
pydot = "==4.0.1"
pypsa = "==1.0.3"
pytables = "==3.10.2"
python = "==3.12.12"
pyyaml = "==6.0.3"
requests = "==2.32.5"
scikit-learn = "==1.7.2"
seaborn = "==0.13.2"
