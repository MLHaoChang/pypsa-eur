[feature.test.tasks]

integration-tests = """
    snakemake -call solve_elec_networks --configfile config/test/config.electricity.yaml &&
    snakemake -call --configfile config/test/config.overnight.yaml &&
    snakemake -call --configfile config/test/config.myopic.yaml &&
    snakemake -call resources/test-elec-clusters/networks/base_s_adm.nc --configfile config/test/config.clusters.yaml &&
    snakemake -call --configfile config/test/config.scenarios.yaml -n &&
    snakemake -call plot_power_networks_clustered --configfile config/test/config.tyndp.yaml &&
    echo "All tests completed successfully."
"""
clean-tests = """
    snakemake -call solve_elec_networks --configfile config/test/config.electricity.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.overnight.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.myopic.yaml --delete-all-output ;
    snakemake -call resources/test-elec-clusters/networks/base_s_adm.nc --configfile config/test/config.clusters.yaml --delete-all-output ;
    snakemake -call --configfile config/test/config.scenarios.yaml -n --delete-all-output ;
    snakemake -call plot_power_networks_clustered --configfile config/test/config.tyndp.yaml --delete-all-output ;
	echo "All test outputs have been cleaned up."
"""
unit-tests = "pytest test"

all-tests = {depends-on = ["integration-tests", "clean-tests", "unit-tests"]}

generate-config = "pytest test/test_config_schema.py --fix"

# Workstream H: the pywebview desktop shell. Deliberately a FEATURE, not a
# default dependency — the default environment is what `snakemake -call` solves
# PyPSA-Eur with, and re-solving it to add a GUI toolkit is a risk with no
# upside. Run the shell with `pixi run -e desktop ...`.
#
# PyInstaller is NOT here. D14 builds the frozen app from a separate pip-wheel
# venv, because freezing the conda env produces a build that works on the
# developer's box and fails on a clean machine.
[feature.desktop.dependencies]
# Pinned DOWN to what `default` has locked, because the shell runs the
# pypsa-gui backend and the backend suite runs in `default`. Solved freely, a
# new environment does not reproduce an old lock — it takes today's newest, and
# `[exclude-newer] pypsa = "0d"` at the top of this file deliberately lets pypsa
# float. Measured: an unpinned `desktop` resolved pypsa 1.2.4 against the
# suite's 1.1.2, plus numpy, scipy and highspy — 112 of 514 packages.
#
# That matters concretely: CLAUDE.md documents multi-port-Link vintage
# workarounds scoped to PyPSA 1.1.2 that took five re-solves to converge on,
# and highspy is the LP solver PyPSA-Eur itself optimises with.
#
# The FIRST attempt pinned only `python`, on the theory that the interpreter
# was the divergence. It was one of 112. The second attempt put both
# environments in a solve-group, which does make them agree — by dragging
# `default` UP to pypsa 1.2.4, numpy 2.5.1 and highspy 1.15.1, re-solving the
# environment `snakemake -call` uses. Pinning here is the only direction that
# leaves the model environment untouched.
#
# `python` and `pandas` are pinned per-platform BELOW, not here: `default`
# itself resolves different versions per platform (python 3.13.13 on osx,
# 3.13.0 on win-64, 3.12.13 on linux-64; pandas 3.0.3 on win-64 and 2.3.3
# elsewhere), so no single value can match it. The previous `python = "3.13.*"`
# could never hold on linux-64 and silently created a split there.
#
# `tests/test_desktop_environment.py` holds the authoritative list and compares
# version AND build string. Its `_CORE` is deliberately WIDER than the pins
# here: a name it lists that already agrees between the two environments needs
# no pin, and adding a pin that already agrees changes nothing. What the test
# guarantees is that any future drift in one of those names fails the suite —
# not that the two lists are the same length.
#
# Full parity is NOT achieved and is not attempted: ~100 further transitive
# packages (bokeh, beautifulsoup4, ...) sit on newer patch versions in
# `desktop`. None is imported by the backend. Closing that gap needs a
# solve-group, which re-solves `default` and upgrades the model environment.
pypsa = "==1.1.2"
numpy = "==2.4.4"
# The LP solver PyPSA calls. A different build here changes optimisation
# results, which is the one thing this workstream must not touch.
highspy = "==1.14.0"
sqlalchemy = "==2.0.49"
alembic = "==1.18.4"
matplotlib = "==3.10.9"
# Everything below is in the BACKEND'S IMPORT CLOSURE, measured by importing
# pypsa/fastapi/starlette/uvicorn/sqlalchemy/pydantic/alembic/anthropic and
# reading `sys.modules`. An earlier round pinned only what the backend imports
# DIRECTLY (4 packages) and claimed the rest was invisible to it; 16 were not,
# `anyio` among them — the async runtime under starlette and uvicorn, which is
# the layer the shell's bounded-shutdown design rests on.
anyio = "==4.13.0"
certifi = "==2026.4.22"
charset-normalizer = "==3.4.7"
geopandas = "==1.1.3"
greenlet = "==3.5.0"
idna = "==3.13"
narwhals = "==2.21.0"
numexpr = "==2.14.1"
plotly = "==6.6.0"
# noarch, so one build for all platforms; version alone let a rebuild through.
polars = { version = "==1.40.1", build = "pyh58ad624_0" }
pydeck = "==0.9.2"
requests = "==2.34.1"
tqdm = "==4.67.3"
typing-extensions = "==4.15.0"
ujson = "==5.12.0"

[feature.desktop.target.osx-arm64.dependencies]
# Build pinned, not just version: both environments resolved scipy
# 1.17.1 while shipping different binaries (_0 vs _1).
scipy = { version = "==1.17.1", build = "py313hc753a45_0" }
