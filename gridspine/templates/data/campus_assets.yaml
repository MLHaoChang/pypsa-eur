# The shipped default asset library for the campus electrical study (plan C7).
#
# EVERY COST HERE IS AN ORDER-OF-MAGNITUDE PLACEHOLDER, to be replaced by
# vendor quotes. No price, rating or impedance below was checked against a
# price list, a datasheet or a standard, so every value is tagged `assumed`:
# it is a typical figure written down, not a figure read from a text. Where a
# number comes from elsewhere in this repository it says so in a note:
# transformer vk, vkr, no-load losses and i0 are producers/campus.py's
# typical class data (_TRAFO_CLASS, PFE_KW_PER_MVA, I0_PERCENT), and a
# switchgear peak rating is 2.5 x its short-time rating, the 50 Hz ratio in
# static/campus_sc.py (PEAK_FACTOR). Both are themselves unverified.
#
# Layout. Every number is {value, source[, note]}; `source` is one of
# measured | datasheet | assumed. Every entry has a unique `id`, a capex
# (`capex_eur`, or `capex_eur_per_km` for a cable, or per bay for
# switchgear), `opex_frac` (fixed opex per year as a fraction of capex) and
# `lifetime_a`. The library has one discount rate, a currency and a price
# year. A project may carry an edited copy; this file is the default.

discount_rate: {value: 0.07, source: assumed, note: "a stand-in; set the project's own rate"}
currency: EUR
price_year: 2026

