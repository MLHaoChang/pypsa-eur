# The shipped default asset library for the campus electrical study (plan C7),
# adopted from the 2026-10-12 reference-cost proposal.
#
# Reference costs for the campus asset library, read from public, cited
# sources. These are REFERENCE VALUES, NOT QUOTES: a regulator's standard
# costs or a planning catalogue's figures, converted to one currency and price
# year. They do not replace vendor quotes.
#
# The investment case's defaults pack (version 2026-10-23) transcribes these
# costs, and its manifest pins this file's sha256: a price change here needs a
# new pack version, never an edit of a shipped one.
#
# How each number was read and converted:
#   docs/superpowers/research/2026-10-12-campus-asset-reference-costs.md
# Every cost carries its source tag and a note naming the row it came from.
#
# Tags. `literature`: read from a cited source below, converted as stated.
# `assumed`: no usable source was found for that kind or size, or the value is
# extrapolated outside the source's range; the note says which. Ratings,
# impedances and losses are unchanged from the shipped library and stay
# `assumed` (only a cost may be tagged `literature`).
#
# Sources (citation keys used in the notes):
#   [EI-NVL]    Energimarknadsinspektionen (Swedish Energy Markets Inspectorate),
#               "Normvärdeslista elnät 2024-2027", xlsx, sheet "NVL RP4", column
#               "Normvärde 2022 [SEK]" (2023-10-13). Installed costs of grid
#               assets used to value Swedish DSOs' capital base.
#               https://ei.se/download/18.61d7efeb18b048db98c4e48/1697184391450/Normv%C3%A4rdeslista-2024-2027.xlsx
#   [DEA-TRANS] Danish Energy Agency and Energinet, "Technology Data for Energy
#               Transport", version 0008 (Dec 2025), ch. 1, Table 13 (O&M in %
#               of capex) and Table 7 note 5. https://ens.dk/media/7680/download
#   [DEA-DIST]  Danish Energy Agency and Energinet, "Technology Data for Energy
#               Transport", version 0006, ch. 111 "Electricity distribution
#               grid", data sheets (technical lifetime 40 a, note C; fixed O&M
#               0.51 % of investment, notes L and Q). Version 0008 states that
#               its distribution-level data are unchanged.
#               https://ens.dk/media/6440/download
#   [NEP-2021]  50Hertz, Amprion, TenneT, TransnetBW, "Netzentwicklungsplan
#               Strom 2035, Version 2021, 2. Entwurf: Kostenschätzungen"
#               (standard costs, cost basis mid-2020; quoted in notes only).
#               https://www.netzentwicklungsplan.de/sites/default/files/2023-02/26_NEP_2035_V2021_2E_Kostenschaetzung_0.pdf
#
# Conversion. Money is EUR in 2025 prices. SEK of 2022 -> EUR at the ECB's
# 2022 annual average reference rate, 10.6296 SEK/EUR (series
# EXR.A.SEK.EUR.SP00.A), then escalated 2022 -> 2025 by the producer price
# index for NACE C27.1 (electric motors, generators, transformers and
# electricity distribution and control apparatus): Eurostat dataset
# sts_inpp_a, euro area EA20, total market, unadjusted, index 2021=100,
# annual values 108.6 (2022) -> 119.8 (2025), factor 1.1031; retrieved
# 2026-10-12; the owner chose this index on 2026-10-12. Combined:
# 1 SEK (2022) = 0.10378 EUR (2025). Rounded
# to 100 EUR. A size between two of the source's sizes is interpolated on a
# straight line in log-log (a local power law); the exponent is in the note.
#
# The discount rate is unchanged (0.07, assumed): no source here justifies
# another, and the project's own rate replaces it when the study runs.
#
# Layout as in the shipped library: every number is {value, source[, note]}.

discount_rate: {value: 0.07, source: assumed, note: "unchanged stand-in, no source justifies another; the project's own rate replaces it (plan D1a)"}
currency: EUR
price_year: 2025

