      tiq: {value: 0.01, from: "WECC 2019 p.28 example reec_a 'tip' (typo for tiq; Table 10 p.62 lists tiq)"}
      dpmax: {value: 1.0, from: "WECC 2019 p.28 example reec_a dpmax"}
      dpmin: {value: -1.0, from: "WECC 2019 p.28 example reec_a dpmin"}
      pmax: {value: 1.0, from: "WECC 2019 p.28 example reec_a pmax"}
      pmin: {value: 0.0, from: "WECC 2019 p.28 example reec_a pmin"}
      imax: {value: 1.0, from: "WECC 2019 p.28 example reec_a imax"}
      tpord: {value: 0.01, from: "WECC 2019 p.28 example reec_a tpord"}
      vq1: {value: 0.4, from: "WECC 2019 p.28 example reec_a vq1"}
      iq1: {value: 0.4, from: "WECC 2019 p.28 example reec_a iq1"}
      vq2: {value: 0.9, from: "WECC 2019 p.28 example reec_a vq2"}
      iq2: {value: 1.0, from: "WECC 2019 p.28 example reec_a iq2"}
      vq3: {value: 1.2, from: "WECC 2019 p.28 example reec_a vq3"}
      iq3: {value: 1.0, from: "WECC 2019 p.28 example reec_a iq3"}
      vq4: {value: 1.3, from: "adjusted: source vq4=0.0 is an unused trailing pair of a 3-point table; strictly increasing breakpoints required, so set just above vq3"}
      iq4: {value: 1.0, from: "adjusted: source iq4=0.0 (unused pair); held at iq3 so the curve equals the source 3-point table"}
      vp1: {value: 0.4, from: "WECC 2019 p.28 example reec_a vp1"}
      ip1: {value: 0.0, from: "WECC 2019 p.28 example reec_a ip1"}
      vp2: {value: 0.9, from: "WECC 2019 p.28 example reec_a vp2"}
      ip2: {value: 1.0, from: "WECC 2019 p.28 example reec_a ip2"}
      vp3: {value: 1.2, from: "WECC 2019 p.28 example reec_a vp3"}
      ip3: {value: 1.0, from: "WECC 2019 p.28 example reec_a ip3"}
      vp4: {value: 1.3, from: "adjusted: source vp4=0.0 is an unused trailing pair; strictly increasing breakpoints required, so set just above vp3"}
      ip4: {value: 1.0, from: "adjusted: source ip4=0.0 (unused pair); held at ip3 so the curve equals the source 3-point table"}
  reecc:
    source: "WECC REMTF, 'WECC Battery Storage Dynamic Modeling Guideline', November 2016 (file rev. 4-7-17), pp.6, 11-12, 20 (Table 5) and Appendix A p.38, https://www.wecc.org/sites/default/files/documents/meeting/2024/WECC%20Battery%20Storage%20Guideline%20updates%204-7-17%20.pdf ; Appendix A states REEC_C = REEC_A plus T/SOC parameters, so shared parameters are taken from the WECC 2019 PV guideline example reec_a record pp.27-28 (URL as reec block); pmin from EPRI, 'Model User Guide for Generic Renewable Energy System Models', 3002006525, Technical Update June 2015, Section 3 p.3-8"
