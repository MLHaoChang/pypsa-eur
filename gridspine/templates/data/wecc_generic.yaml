      pfflag: {value: 0, from: "WECC BESS 2016 Table 5 p.20 ('Pflag' = PF control flag set 0)"}
      vflag: {value: 1, from: "WECC BESS 2016 Table 5 p.20 Vflag=1"}
      qflag: {value: 1, from: "WECC BESS 2016 Table 5 p.20 Qflag=1"}
      pqflag: {value: 1, from: "WECC BESS 2016 Table 5 p.20 PQflag=1 (P priority for frequency support)"}
      vdip: {value: 0.5, from: "WECC 2019 p.27 example reec_a vdip (BESS 2016 App. A: same as REEC_A)"}
      vup: {value: 1.1, from: "WECC 2019 p.27 example reec_a vup"}
      trv: {value: 0.01, from: "WECC 2019 p.27 example reec_a trv"}
      dbd1: {value: -0.05, from: "WECC 2019 p.27 example reec_a dbd1"}
      dbd2: {value: 0.05, from: "WECC 2019 p.27 example reec_a dbd2"}
      kqv: {value: 2.0, from: "WECC 2019 p.27 example reec_a kqv"}
      iqh1: {value: 1.0, from: "WECC 2019 p.27 example reec_a iqh1"}
      iql1: {value: -1.0, from: "WECC 2019 p.27 example reec_a iql1"}
      vref0: {value: 1.0, from: "WECC 2019 p.27 example reec_a vref0"}
      tp: {value: 0.01, from: "WECC 2019 p.27 example reec_a tp"}
      qmax: {value: 0.6, from: "WECC 2019 p.28 example reec_a qmax"}
      qmin: {value: -0.6, from: "WECC 2019 p.28 example reec_a qmin"}
      vmax: {value: 1.2, from: "WECC 2019 p.28 example reec_a vmax"}
      vmin: {value: 0.8, from: "WECC 2019 p.28 example reec_a vmin"}
      kqp: {value: 1.0, from: "WECC 2019 p.28 example reec_a kqp"}
      kqi: {value: 1.0, from: "WECC 2019 p.28 example reec_a kqi"}
      kvp: {value: 1.0, from: "WECC 2019 p.28 example reec_a kvp"}
      kvi: {value: 1.0, from: "WECC 2019 p.28 example reec_a kvi"}
      tiq: {value: 0.01, from: "WECC 2019 p.28 example reec_a 'tip' (tiq)"}
      dpmax: {value: 1.0, from: "WECC 2019 p.28 example reec_a dpmax"}
      dpmin: {value: -1.0, from: "WECC 2019 p.28 example reec_a dpmin"}
      pmax: {value: 1.0, from: "WECC 2019 p.28 example reec_a pmax (BESS 2016 Fig. 2 p.6: P from -1 to 1 pu)"}
      pmin: {value: -1.0, from: "EPRI 3002006525 p.3-8 reec_c example 'Pmin = -Pmax' (Ipmin = -Ipmax, p.3-7); BESS 2016 Fig. 2 p.6 P=-1 charging"}
      imax: {value: 1.0, from: "WECC 2019 p.28 example reec_a imax"}
      tpord: {value: 0.01, from: "WECC 2019 p.28 example reec_a tpord"}
      vq1: {value: 0.4, from: "WECC 2019 p.28 example reec_a vq1"}
      iq1: {value: 0.4, from: "WECC 2019 p.28 example reec_a iq1"}
      vq2: {value: 0.9, from: "WECC 2019 p.28 example reec_a vq2"}
      iq2: {value: 1.0, from: "WECC 2019 p.28 example reec_a iq2"}
      vq3: {value: 1.2, from: "WECC 2019 p.28 example reec_a vq3"}
      iq3: {value: 1.0, from: "WECC 2019 p.28 example reec_a iq3"}
      vq4: {value: 1.3, from: "adjusted: source vq4=0.0 is an unused trailing pair; set above vq3 for strictly increasing breakpoints"}
      iq4: {value: 1.0, from: "adjusted: source iq4=0.0 (unused pair); held at iq3"}
      vp1: {value: 0.4, from: "WECC 2019 p.28 example reec_a vp1"}
      ip1: {value: 0.0, from: "WECC 2019 p.28 example reec_a ip1"}
      vp2: {value: 0.9, from: "WECC 2019 p.28 example reec_a vp2"}
      ip2: {value: 1.0, from: "WECC 2019 p.28 example reec_a ip2"}
      vp3: {value: 1.2, from: "WECC 2019 p.28 example reec_a vp3"}
      ip3: {value: 1.0, from: "WECC 2019 p.28 example reec_a ip3"}
      vp4: {value: 1.3, from: "adjusted: source vp4=0.0 is an unused trailing pair; set above vp3 for strictly increasing breakpoints"}
      ip4: {value: 1.0, from: "adjusted: source ip4=0.0 (unused pair); held at ip3"}
      t: {value: 7200.0, from: "WECC BESS 2016 p.11 worked SOC example T = 2 h = 7200 s (App. A p.38 range 3600-36000 s)"}
      socini: {value: 0.5, from: "WECC BESS 2016 App. A p.38 typical range 20%-80%; midpoint chosen"}
      socmax: {value: 0.8, from: "WECC BESS 2016 p.12 item C: SOCmax about 80% (App. A range 75-85%)"}
      socmin: {value: 0.2, from: "WECC BESS 2016 p.12 item C: SOCmin about 20% (App. A range 10-20%)"}
  repc:
    source: "WECC MVWG, 'Solar Photovoltaic Power Plant Modeling and Validation Guideline', December 9, 2019, Section 'Model Invocation', example repc_a record, p.28 (illustration only), https://www.wecc.org/sites/default/files/documents/meeting/2024/Solar%20PV%20Plant%20Modeling%20and%20Validation%20Guidline.pdf"
    values:
      vcflag: {value: 0, from: "WECC 2019 p.28 example repc_a vcmpflg (reactive droop, kc)"}
      refflag: {value: 1, from: "WECC 2019 p.28 example repc_a refflg (plant voltage control)"}
      fflag: {value: 1, from: "WECC 2019 p.28 example repc_a frqflg"}
