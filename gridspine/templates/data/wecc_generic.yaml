# Owner decision GC04-DEFAULTS-1 ("Generic, tagged"): one public generic WECC parameter
# set for grid-following converters with no supplied parameters. Every value is assumed;
# a pack that uses it is not for submission until replaced with OEM data. Transcribed
# from public WECC/EPRI documents (cited per block); loaded and checked by
# gridspine/templates/wecc_generic.py.
source_note: "Generic WECC 2nd-gen IBR parameters transcribed from public WECC/EPRI example records (illustrative, not any real plant); PSLF-named example values mapped to PSS/E REGCA1/REECA1/REECC1/REPCA1 keys."
blocks:
  regc:
    source: "WECC MVWG, 'Solar Photovoltaic Power Plant Modeling and Validation Guideline', December 9, 2019, Section 'Model Invocation', example regc_a record, p.27 (illustration only), https://www.wecc.org/sites/default/files/documents/meeting/2024/Solar%20PV%20Plant%20Modeling%20and%20Validation%20Guidline.pdf ; khv only: NREL-Sienna PowerSystemsTestData, psse_dyr/240busWECC_2018_PSS.dyr, REGCA1 record l.789-792 (master, accessed 2026-11-17), https://github.com/NREL-Sienna/PowerSystemsTestData/blob/master/psse_dyr/240busWECC_2018_PSS.dyr"
    values:
      lvplsw: {value: 0, from: "WECC 2019 p.27 example regc_a lvplsw=0 (also p.31: set lvplsw=0 so LVPL does not contradict VDL tables)"}
      tg: {value: 0.02, from: "WECC 2019 p.27 example regc_a tg"}
      rrpwr: {value: 1.4, from: "WECC 2019 p.27 example regc_a rrpwr"}
      brkpt: {value: 0.9, from: "WECC 2019 p.27 example regc_a brkpt"}
      zerox: {value: 0.5, from: "WECC 2019 p.27 example regc_a zerox"}
      lvpl1: {value: 1.0, from: "WECC 2019 p.27 example regc_a lvpl1"}
      volim: {value: 1.1, from: "WECC 2019 p.27 example regc_a vtmax (PSLF name of PSS/E Volim)"}
      lvpnt1: {value: 0.05, from: "WECC 2019 p.27 example regc_a lvpnt1"}
      lvpnt0: {value: 0.01, from: "WECC 2019 p.27 example regc_a lvpnt0"}
      iolim: {value: -1.0, from: "WECC 2019 p.27 example regc_a qmin (PSLF name of PSS/E Iolim)"}
      tfltr: {value: 0.01, from: "WECC 2019 p.27 example regc_a tfltr"}
      khv: {value: 0.0, from: "NREL-Sienna 240busWECC_2018_PSS.dyr REGCA1 l.791 CON(11) Khv=0.0 (not a PSLF regc_a parameter, so absent from WECC 2019 example)"}
      iqrmax: {value: 20.0, from: "WECC 2019 p.27 example regc_a iqrmax"}
      iqrmin: {value: -20.0, from: "WECC 2019 p.27 example regc_a iqrmin"}
      accel: {value: 0.7, from: "WECC 2019 p.27 example regc_a accel"}
  reec:
    source: "WECC MVWG, 'Solar Photovoltaic Power Plant Modeling and Validation Guideline', December 9, 2019, Section 'Model Invocation', example reec_a record, pp.27-28 (illustration only), https://www.wecc.org/sites/default/files/documents/meeting/2024/Solar%20PV%20Plant%20Modeling%20and%20Validation%20Guidline.pdf"
    values:
      pfflag: {value: 0, from: "WECC 2019 p.28 example reec_a pfflag (Table 3 p.29: 0 under plant control)"}
      vflag: {value: 1, from: "WECC 2019 p.28 example reec_a vflag"}
      qflag: {value: 1, from: "WECC 2019 p.28 example reec_a qflag"}
      pflag: {value: 0, from: "WECC 2019 p.28 example reec_a pflag (Table 10 p.62: always 0 for PV)"}
      pqflag: {value: 0, from: "WECC 2019 p.28 example reec_a pqflag (Q priority)"}
      vdip: {value: 0.5, from: "WECC 2019 p.27 example reec_a vdip"}
      vup: {value: 1.1, from: "WECC 2019 p.27 example reec_a vup"}
      trv: {value: 0.01, from: "WECC 2019 p.27 example reec_a trv"}
      dbd1: {value: -0.05, from: "WECC 2019 p.27 example reec_a dbd1"}
      dbd2: {value: 0.05, from: "WECC 2019 p.27 example reec_a dbd2"}
      kqv: {value: 2.0, from: "WECC 2019 p.27 example reec_a kqv"}
      iqh1: {value: 1.0, from: "WECC 2019 p.27 example reec_a iqh1"}
      iql1: {value: -1.0, from: "WECC 2019 p.27 example reec_a iql1"}
      vref0: {value: 1.0, from: "WECC 2019 p.27 example reec_a vref0"}
      iqfrz: {value: 0.0, from: "WECC 2019 p.27 example reec_a iqfrz"}
      thld: {value: 0.0, from: "WECC 2019 p.27 example reec_a thld"}
      thld2: {value: 0.0, from: "WECC 2019 p.27 example reec_a thld2"}
      tp: {value: 0.01, from: "WECC 2019 p.27 example reec_a tp"}
      qmax: {value: 0.6, from: "WECC 2019 p.28 example reec_a qmax"}
      qmin: {value: -0.6, from: "WECC 2019 p.28 example reec_a qmin"}
      vmax: {value: 1.2, from: "WECC 2019 p.28 example reec_a vmax"}
      vmin: {value: 0.8, from: "WECC 2019 p.28 example reec_a vmin"}
      kqp: {value: 1.0, from: "WECC 2019 p.28 example reec_a kqp"}
      kqi: {value: 1.0, from: "WECC 2019 p.28 example reec_a kqi"}
      kvp: {value: 1.0, from: "WECC 2019 p.28 example reec_a kvp"}
      kvi: {value: 1.0, from: "WECC 2019 p.28 example reec_a kvi"}
