# IEEE 39-bus (New England) dynamic data, on the 100 MVA system base.
#
# PROVENANCE IS PER FIELD. Read the tags, not this comment.
#
# datasheet: the classic two-axis set (Athay, Podmore & Virmani 1979; Pai,
#   "Energy Function Analysis for Power System Stability", 1989, Table 3.2),
#   reproduced across the IEEE 39-bus literature. It gives H, Xd, Xq, X'd,
#   X'q, Xl, T'do, T'qo. Generator-to-bus mapping: Gen1->BUS_39 (the
#   aggregated interconnection equivalent, H=500), Gen2->BUS_31 (the slack),
#   Gen3..9->BUS_32..38, Gen10->BUS_30. The H values are carried over
#   unchanged from the increment-2 file. NOTE for the owner: the published
#   table gives H=28.6 for the BUS_33 machine; this file has carried 38.6
#   since increment 2 and it has NOT been changed here -- check against your
#   source before a .dyr is exported.
#
# assumed: everything the classic set does not contain but a GENROU/GENSAL
#   record requires. Rules used, so they can be revisited as one decision:
#     xd_pp   = midpoint of x'd and xl, rounded to 4 dp (must satisfy
#               xd > x'd > x''d > xl; the loader enforces it)
#     t_do_pp = 0.05 s, t_qo_pp = 0.05 s   (typical subtransient values)
#     s1 = 0.05, s12 = 0.30                (typical saturation, S(1.0)/S(1.2))
#     d = 0.0                              (no mechanical damping term)
#     rx_sc = 0.05, cos_phi = 0.85         (IEC 60909 generator R/X and rated
#               power factor, typical for large machines; the classic set has
#               Ra = 0 and no rating data)
#
# G_BUS_30 is GENSAL, not GENROU: the classic set gives it T'qo = 0 and a
# negligible X'q, i.e. no q-axis transient -- a salient-pole machine. Forcing
# it into GENROU would require inventing a T'qo.
#
# SLK_BUS_31 models grid import: excluded from pocket inertia (assumed scope).
#
# W_*/S_* are the RES_LEDGER sites (ingest/pandapower_source.py). They are
# inverters: no H, never in inertia. mbase_mva is the ledger's installed MW
# read as MVA -- the same ledgered assumption the RAW writer's MBASE fallback
# makes. k_sc / rx_sc are the IEC 60909 converter-source parameters (max
# current ratio Ik''/In and R/X); typical values, assumed, for task 6.
#
# The inverters' REGCA1 + REECA1 group (increment 8) is ONE generic set,
# shared through the anchor below so five units do not repeat 65 lines each;
# the loader still records one (unit, param, value, source) row per field.
# Every value is `assumed`: typical generic WECC second-generation values, NOT
# a vendor model. Choices that are one decision, so they can be revisited:
#   wind is Type 4 (full converter): REGCA1 + REECA1, no drive train;
#   PQFLAG = 0 (Q priority during a dip), Kqv = 2 on a +/-0.05 pu deadband
#     with Vdip/Vup = 0.9/1.1 -- reactive current injection in the style of
#     European FRT requirements;
#   VFLAG = QFLAG = 0: constant Q at the load-flow value, since no plant
#     controller (REPCA1) is modelled;
#   Imax = 1.1 pu on MBASE; VDL tables flat at 1.1 (no voltage-dependent
#     current limiting); Vref0 = 0 (initialised from the load flow).
x-ibr-generic: &ibr_generic
  regc_lvplsw:  {value: 1, source: assumed}
  regc_tg:      {value: 0.02, source: assumed}
  regc_rrpwr:   {value: 10.0, source: assumed}
